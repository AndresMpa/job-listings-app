# Brings up Postgres + the API. Ollama is assumed to run elsewhere (host,
# or another container on a shared network) — point ollama.url at it via
# config.yaml or the OLLAMA_URL env var below.
#
# A one-off scan (fetch + score + persist) is run separately, for every
# profile in ./profiles or just one:
#   docker compose run --rm api python main.py
#   docker compose run --rm api python main.py -p andres
# Wire that into cron/systemd-timer on the host, or into whatever scheduler
# already exists on your shared Docker network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    volumes:
      - job_search_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://jobs:jobs@db:5432/jobs
      OLLAMA_URL: ${OLLAMA_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml   # writable: PUT /config saves here
      - ./profiles:/app/profiles         # writable: PUT /profiles/{name} saves here
    entrypoint: ["uvicorn", "job_search.api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  job_search_pgdata:
