# Wires job-search-automation (backend) + job-listings-app (frontend)
# together. Expects the sibling layout:
#
#   job-platform/
#     docker-compose.yml   <- this file
#     job-search-automation/
#     job-listings-app/
#
# Ollama is assumed to run elsewhere (host, or another container on your
# shared Docker network) — point OLLAMA_URL at it below.
#
# Usage:
#   docker compose up -d --build
#   docker compose run --rm backend python main.py   # one-off scan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: jla-db
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    volumes:
      - job_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./job-search-automation
    restart: unless-stopped
    container_name: jla-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://jobs:jobs@db:5432/jobs
      OLLAMA_URL: ${OLLAMA_URL}
    volumes:
      - ./job-search-automation/config.yaml:/app/config.yaml
      - ./job-search-automation/profiles:/app/profiles
      - ./job-search-automation/output:/app/output
    ports:
      - "8000:8000"
    command: ["uvicorn", "job_search.api:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./job-listings-app
    restart: unless-stopped
    container_name: jla-frotend
    depends_on:
      - backend
    environment:
      NUXT_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  job_platform_pgdata:
